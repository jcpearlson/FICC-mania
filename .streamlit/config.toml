[theme]
base = "dark"
primaryColor = "#4C8DFF"
backgroundColor = "#0B0E14"
secondaryBackgroundColor = "#141922"
textColor = "#E4E8F0"
font = "sans serif"

[server]
headless = true
fileWatcherType = "auto"
# Bind loopback only. Streamlit's default is every interface, which would put
# an app with no authentication of any kind onto the local network (and onto
# the internet behind a forwarded port). Change this only if you have put an
# authenticating proxy in front of it -- see SECURITY.md.
address = "localhost"

[browser]
gatherUsageStats = false
