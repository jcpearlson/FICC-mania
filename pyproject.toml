[project]
name = "ficc-mania"
version = "0.1.0"
description = "A practitioner's FICC dashboard built entirely on free, public data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.62",
    "plotly>=5.24",
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.50",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# Chart labels and HTML strings can exceed the line limit; paired plotting
# sequences intentionally truncate to the shorter input.
ignore = ["E501", "B905"]
